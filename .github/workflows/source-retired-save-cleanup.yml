name: PlayDock 잔존 게임 세이브 기능 제거 검증
on:
  push:
    branches: [refactor/source-audit-20261124]
    paths:
      - .github/workflows/source-retired-save-cleanup.yml
      - tests/audit/test_retired_save_cleanup.py
      - tests/audit/test_linked_read_optimization.py
      - src/playdock/controllers/game_actions.py
      - src/playdock/workers/game_tasks.py
      - app.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt 및 테스트 의존성
        run: python -m pip install -r requirements.txt pytest
      - name: 세이브 기능 제거 및 데이터 보존 확인
        run: python -m pytest -q -s tests/audit/test_retired_save_cleanup.py tests/audit/test_linked_read_optimization.py tests/test_data_management.py tests/test_upgrade_v060.py tests/test_playdock_rebrand_v077.py
      - name: 전체 Windows 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py src/playdock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
