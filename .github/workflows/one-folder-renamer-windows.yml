name: PlayDock 폴더 선택만으로 파일명 변경 Windows 빌드

on:
  push:
    branches: [experiment-bidirectional-lookup-20261121]
    paths: [".github/workflows/one-folder-renamer-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 빌드 도구와 테스트 설치
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.11,<7" pytest
      - name: 프로그램 문법 및 안전 동작 테스트
        shell: pwsh
        run: |
          python -m compileall -q experiments/dlsite_detector/folder_rename.py scripts/one_folder_renamer.py
          python -m pytest -q tests/test_code_only.py tests/test_dlsite_steam_priority.py tests/test_research_handoff.py tests/test_rename_companion.py tests/test_folder_rename.py
      - name: 독립 Windows 단일 EXE 빌드
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PlayDock-One-Folder-Renamer --paths . --exclude-module ddgs --exclude-module PySide6 scripts/one_folder_renamer.py
      - name: EXE 자체 실행 진단
        shell: pwsh
        run: |
          $path = (Resolve-Path "dist/PlayDock-One-Folder-Renamer.exe").Path
          $p = Start-Process -FilePath $path -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "단일 EXE 자체 진단 실패: $($p.ExitCode)" }
      - name: 깨끗한 배포 파일 (사용자 목록 제외)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "one_folder_release" | Out-Null
          Copy-Item "dist/PlayDock-One-Folder-Renamer.exe" "one_folder_release/"
          Copy-Item "scripts/ONE_FOLDER_README_KO.txt" "one_folder_release/사용법_먼저_읽기.txt"
          if ((Get-ChildItem "one_folder_release" -File).Count -ne 2) { throw "배포 파일 수 오류" }
          Get-FileHash "one_folder_release/PlayDock-One-Folder-Renamer.exe" -Algorithm SHA256
      - name: 공개용 EXE 업로드 (개인 조사 JSON 포함 금지)
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock-One-Folder-Renamer-Clean-Windows
          path: one_folder_release/
          if-no-files-found: error
          retention-days: 30
