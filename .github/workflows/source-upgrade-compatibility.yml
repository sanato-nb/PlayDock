name: PlayDock 기존 사용자 데이터 호환 검증
on:
  push:
    branches: [refactor/source-audit-20261124]
    paths:
      - scripts/verify_upgrade_compatibility.py
      - .github/workflows/source-upgrade-compatibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 기존 소스 및 최신 배포 파일 준비
        shell: pwsh
        run: |
          git worktree add --detach ../upgrade-baseline af10566aeb5a066ac5ee9beb9565823b73895002
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Build-Windows-Release.ps1 -NoLaunch -NoWinget
      - name: 기존 데이터 생성 및 실제 payload 교체 검증
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe scripts/verify_upgrade_compatibility.py --baseline ../upgrade-baseline --source . --dist dist --output upgrade-evidence/result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe scripts/audit_windows_bundle.py dist/PlayDock.exe --output upgrade-evidence/bundle.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe scripts/smoke_frozen_launcher.py dist/PlayDock.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-upgrade-compatibility
          path: |
            upgrade-evidence/
            dist/SHA256SUMS.txt
