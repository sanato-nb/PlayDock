name: PlayDock 9단계 Windows 실행 및 성능 검증 (빌드 없음)
on:
  pull_request:
    branches: [feature/ai-identity-import-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    if: github.event_name != 'pull_request' || github.head_ref == 'refactor/ui-cleanup-20261125'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        count: [100, 500, 1000, 5000]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 동일 런타임 설치
        run: python -m pip install -r requirements.txt psutil
      - name: 동일 환경 기준 및 현재 소스 실행
        shell: pwsh
        run: |
          git worktree add --detach ../stage9-baseline 86635400e4c925ddfd63e144112214eaaf27f50b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage9_runtime.py --source ../stage9-baseline --output stage9/before.json --count ${{ matrix.count }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage9_runtime.py --source . --output stage9/after.json --count ${{ matrix.count }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage9_compare.py stage9/before.json stage9/after.json stage9/comparison.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-stage9-performance-${{ matrix.count }}
          path: stage9/**
  dpi-and-endurance:
    if: github.event_name != 'pull_request' || github.head_ref == 'refactor/ui-cleanup-20261125'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt psutil
      - name: 해상도 및 Qt 배율 모의 렌더링
        shell: pwsh
        run: |
          foreach ($scale in @("1","1.25","1.5","2")) {
            $env:QT_SCALE_FACTOR = $scale
            python scripts/stage9_runtime.py --source . --output "stage9/ui-scale-$scale.json" --count 100 --ui-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 60초 반복 조작 안정성
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR = "1"
          python scripts/stage9_runtime.py --source . --output stage9/endurance.json --count 100 --ui-only --endurance 60
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-stage9-dpi-endurance
          path: stage9/**
  native-window:
    if: github.event_name != 'pull_request' || github.head_ref == 'refactor/ui-cleanup-20261125'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt psutil
      - name: Windows 네이티브 Qt 플랫폼 실행
        run: python scripts/stage9_runtime.py --source . --output stage9/native.json --count 100 --ui-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-stage9-native-window
          path: stage9/**
  online:
    if: github.event_name != 'pull_request' || github.head_ref == 'refactor/ui-cleanup-20261125'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: 공개 공식 작품 조회 표본
        run: python scripts/stage9_online.py --source . --output stage9/online.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-stage9-online
          path: stage9/**
