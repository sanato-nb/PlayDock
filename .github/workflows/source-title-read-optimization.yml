name: PlayDock 목록 제목 및 메타데이터 중복 처리 검증
on:
  push:
    branches: [refactor/source-audit-20261124]
    paths:
      - .github/workflows/source-title-read-optimization.yml
      - tests/audit/test_title_read_optimization.py
      - src/playdock/services/library_service.py
      - src/playdock/models/library_tree.py
      - src/playdock/controllers/library.py
      - src/playdock/ui/collection_board.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt 및 테스트 의존성
        run: python -m pip install -r requirements.txt pytest
      - name: 제목 읽기 횟수 및 검색 정렬 동등성
        run: python -m pytest -q -s tests/audit/test_title_read_optimization.py
      - name: 전체 Windows 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py src/playdock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
