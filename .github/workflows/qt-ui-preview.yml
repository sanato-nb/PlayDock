name: PlayDock 실제 Qt UI 캡처 (EXE 빌드 없음)

on:
  push:
    branches:
      - qt-ui-preview-20261116
    paths:
      - scripts/render_ui_preview.py
      - .github/workflows/qt-ui-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-qt-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock:${{ github.workspace }}
    steps:
      - name: 원본 소스 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.12 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Qt 오프스크린 의존성 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
      - name: PlayDock 런타임 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 원본 PySide6 UI 실행 및 캡처
        run: python scripts/render_ui_preview.py
      - name: 실제 화면 PNG를 Actions 아티팩트에 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock-실제-Qt-화면
          path: ui-preview-output/*.png
          if-no-files-found: warn
      - name: 미리보기 전용 브랜치에 PNG 게시
        if: success()
        run: |
          mkdir -p docs/ui-preview
          cp ui-preview-output/*.png docs/ui-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-preview/
          if ! git diff --cached --quiet; then
            git commit -m "문서: 실제 PySide6 UI 캡처 이미지 게시"
            git push
          fi
