name: PlayDock 소스코드 정적 감사
on:
  push:
    branches: [refactor/source-audit-20261124]
    paths:
      - scripts/audit_source.py
      - .github/workflows/source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 기준 커밋 전체 소스 정적 감사
        run: python scripts/audit_source.py --ref af10566aeb5a066ac5ee9beb9565823b73895002 --out audit_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-Source-Audit
          path: audit_output/
