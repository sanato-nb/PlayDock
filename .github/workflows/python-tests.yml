name: PlayDock Python 회귀 테스트 (EXE 빌드 없음)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Linux Qt 오프스크린 실행 의존성 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Python 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 전체 Python 구문 검사
        run: python -m compileall -q app.py title_editor.py src/playdock tests
      - name: pytest 회귀 검사
        run: python -m pytest -q

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python 의존성 설치
        run: python -m pip install -r requirements.txt pytest
      - name: 전체 Python 구문 검사
        run: python -m compileall -q app.py title_editor.py src/playdock tests
      - name: pytest 회귀 검사
        run: python -X faulthandler -m pytest -q
