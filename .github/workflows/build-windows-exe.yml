name: Build clean PlayDock public release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - 'Build-Windows-Release.ps1'
      - 'make_public_release.py'
      - 'docs/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build and verify EXE on a clean Windows runner
        shell: pwsh
        run: ./Build-Windows-Release.ps1 -NoLaunch -NoWinget
      - name: Create new public release without local data
        shell: pwsh
        run: python make_public_release.py --dist dist --manual docs/PlayDock_UserManual_KO_v0.7.7.pdf --out public_release --source .
      - name: Upload clean public downloads
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock_Public_v0.8.2
          path: |
            public_release/PlayDock_Public_v0.8.2.zip
            public_release/PlayDock_Setup_v0.8.2.exe
            public_release/PlayDock_Public_v0.8.2_검사결과.txt
          if-no-files-found: error
          retention-days: 30
