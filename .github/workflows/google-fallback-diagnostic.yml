name: PlayDock Google HTML 폴백 검증
on:
  push:
    branches: [experiment-bidirectional-lookup-20261121]
    paths:
      - ".github/workflows/google-fallback-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-google:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Google 실제 공개 검색 응답 검사
        env:
          PYTHONIOENCODING: utf-8
        run: python -m scripts.diagnose_google_html_fallback
