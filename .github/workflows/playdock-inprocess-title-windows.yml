name: PlayDock 기능·게임 관리 메뉴 정리 Windows 검증

on:
  push:
    branches: [experiment-bidirectional-lookup-20261121, feature/game-management-menu-20261124]
    paths:
      - "app.py"
      - "src/playdock/database/work_repository.py"
      - "src/playdock/database/official_catalog.py"
      - "src/playdock/services/official_work_service.py"
      - "src/playdock/services/official_artwork_service.py"
      - "src/playdock/services/identity_artwork_worker.py"
      - "src/playdock/services/catalog_collection_service.py"
      - "src/playdock/services/catalog_collection_worker.py"
      - "src/playdock/controllers/catalog_collection.py"
      - "src/playdock/ui/dialogs/catalog_collection.py"
      - "src/playdock/services/title_workers.py"
      - "src/playdock/services/bulk_title_service.py"
      - "src/playdock/ui/dialogs/title.py"
      - "tests/test_catalog_collection_v3.py"
      - "tests/test_catalog_preflight_ai_handoff.py"
      - "tests/test_feature_menu_cleanup_v4.py"
      - "tests/test_collected_game_workflow_v3.py"
      - "src/playdock/simple_title_edit.py"
      - "src/playdock/ui/dialogs/identity_artwork.py"
      - "tests/test_identity_artwork_checkboxes.py"
      - "src/playdock/services/data_service.py"
      - "src/playdock/services/library_service.py"
      - "tests/test_work_database_v080.py"
      - "tests/test_playdock_official_import.py"
      - "tests/test_shared_db_location_v3.py"
      - "tests/test_official_catalog.py"
      - "tests/test_top_settings_and_db_status.py"
      - "title_editor.py"
      - "src/playdock/controllers/title_editor.py"
      - "src/playdock/controllers/metadata.py"
      - "src/playdock/controllers/library.py"
      - "src/playdock/controllers/window_actions.py"
      - "src/playdock/ui/launcher_layout.py"
      - "src/playdock/ui/dialogs/database_status.py"
      - "src/playdock/services/database_status_service.py"
      - "tests/test_top_settings_and_db_status.py"
      - "setup_wizard.py"
      - "scripts/Build-Windows-Release.ps1"
      - "scripts/build_setup_windows.bat"
      - "scripts/make_public_release.py"
      - "tests/test_title_editor_inprocess.py"
      - "tests/test_title_editor_from_launcher_v072.py"
      - "tests/test_title_editor_separation.py"
      - "tests/test_playdock_rebrand_v077.py"
      - "tests/test_installer_flow.py"
      - ".github/workflows/playdock-inprocess-title-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python · Qt · Windows 빌드 의존성
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "pyinstaller>=6.11,<7"
      - name: 제목 편집과 설치·백업 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py src/playdock tests
          python -m pytest -q tests/test_feature_menu_cleanup_v4.py tests/test_catalog_preflight_ai_handoff.py tests/test_collected_game_workflow_v3.py tests/test_catalog_collection_v3.py tests/test_identity_artwork_checkboxes.py tests/test_work_database_v080.py tests/test_playdock_official_import.py tests/test_shared_db_location_v3.py tests/test_official_catalog.py tests/test_title_editor_inprocess.py tests/test_title_editor_from_launcher_v072.py tests/test_title_editor_separation.py tests/test_top_settings_and_db_status.py tests/test_playdock_rebrand_v077.py tests/test_installer_flow.py tests/test_public_release.py tests/test_bulk_title_edit_v076.py tests/test_simple_title_editor_v073.py
          if ($LASTEXITCODE -ne 0) { throw "이름 설정 통합 회귀 테스트 실패" }
      - name: PlayDock 전체 Windows 테스트
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "전체 PlayDock 회귀 테스트 실패" }
      - name: PlayDock · 설치기 · 제거기 Windows EXE 빌드
        shell: pwsh
        run: |
          ./scripts/Build-Windows-Release.ps1 -NoLaunch -SkipTests -NoWinget
          if (Test-Path "dist/PlayDock_TitleEditor.exe") {
            throw "분리된 이름 관리자 EXE가 다시 빌드되었습니다"
          }
      - name: 사용자 데이터 없는 ZIP · 설치기 생성
        shell: pwsh
        run: |
          python scripts/make_public_release.py --dist dist --manual docs/PlayDock_UserManual_KO_v0.7.7.pdf --out public_release --source .
          if ($LASTEXITCODE -ne 0) { throw "공개 배포 포장 실패" }
          @'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("public_release/PlayDock_Public_v0.8.3.zip")
          with ZipFile(p) as z:
              names = z.namelist()
              assert "PlayDock.exe" in names
              assert "PlayDock_TitleEditor.exe" not in names
              assert "PlayDock_Setup.exe" in names
              assert not any(n.startswith("data/") and n != "data/" for n in names)
          print("Single PlayDock.exe title editor + empty public user data: PASS")
          '@ | python -
          Get-FileHash "dist/PlayDock.exe" -Algorithm SHA256
      # GitHub Actions downloads each artifact as its own ZIP. Never put the
      # EXE, installer (contains the EXE), and full ZIP (contains both) in a
      # single download: that made a ~345MB duplicate-filled artifact.
      - name: 다운로드 크기 확인 · 배포 종류별 분리
        shell: pwsh
        run: |
          foreach ($file in @(
            "dist/PlayDock.exe",
            "public_release/PlayDock_Setup_v0.8.3.exe",
            "public_release/PlayDock_Public_v0.8.3.zip"
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "배포 파일 없음: $file"
            }
            $mb = [math]::Round((Get-Item -LiteralPath $file).Length / 1MB, 1)
            Write-Host "$file : $mb MB"
          }
      - name: 기존 사용자 업데이트용 PlayDock.exe만 업로드
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock-Update-EXE-Windows
          path: |
            dist/PlayDock.exe
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: 새 설치용 PlayDock_Setup.exe만 업로드
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock-Installer-Only-Windows
          path: public_release/PlayDock_Setup_v0.8.3.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: 전체 배포 패키지는 별도 업로드
        uses: actions/upload-artifact@v4
        with:
          name: PlayDock-Full-Package-Windows
          path: |
            public_release/PlayDock_Public_v0.8.3.zip
            public_release/PlayDock_Public_v0.8.3_검사결과.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
