name: PlayDock 대량 게임 모음집 인덱스 최적화 검증
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dff8315eeb57a3abc8415e0236a8401a2e64cec6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt 및 테스트 의존성
        run: python -m pip install -r requirements.txt pytest
      - name: 대량 목록 동등성 및 ID 조회 횟수 검증
        run: python -m pytest -q -s tests/audit/test_collection_index_optimization.py tests/audit/test_title_read_optimization.py tests/test_library_tree.py tests/test_collection_board.py
      - name: 전체 Windows 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py src/playdock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          exit $LASTEXITCODE
