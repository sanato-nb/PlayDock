name: PlayDock 기능 모듈 계층 재배치 검증
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 0b65c68c678d85c418d0d77895676101cc874709
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 모듈 이동 및 기능 무결성 검증
        run: python scripts/audit_module_relocation.py
      - name: Qt 및 빌드 의존성 설치
        run: python -m pip install -r requirements.txt pytest "pyinstaller>=6.11,<7"
      - name: 전체 Windows 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py setup_wizard.py uninstall_wizard.py src/playdock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Windows EXE 빌드 검증
        shell: pwsh
        run: |
          ./scripts/Build-Windows-Release.ps1 -NoLaunch -SkipTests -NoWinget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/PlayDock.exe")) { throw "PlayDock.exe missing" }
          Get-FileHash "dist/PlayDock.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-Module-Relocation-Audit
          path: audit_output/
