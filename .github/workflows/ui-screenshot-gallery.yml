name: PlayDock 그래파이트 다크 스킨 시안 검수
on:
  push:
    branches: [experiment/graphite-dark-skin-20261125]
    paths:
      - src/playdock/ui/**
      - scripts/capture_all_ui_windows.py
      - .github/workflows/ui-screenshot-gallery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-screenshots:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 캡처 환경 설치
        run: python -m pip install -r requirements.txt pytest
      - name: 실제 Qt 및 Tk UI 캡처
        run: python scripts/capture_all_ui_windows.py --out screenshot-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-graphite-dark-skin-gallery
          path: screenshot-gallery/
          if-no-files-found: error

      - name: 전체 기능 회귀 테스트
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=skin-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-graphite-dark-regression
          path: skin-test-results.xml
