name: PlayDock 공개 게시글용 최신 Windows 화면 캡처
on:
  push:
    branches: [review/public-post-screenshots-20261126]
    paths:
      - scripts/capture_all_ui_windows.py
      - .github/workflows/ui-screenshot-gallery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-screenshots:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 캡처 환경 설치
        run: python -m pip install -r requirements.txt
      - name: 실제 Qt 및 Tk UI 캡처
        run: python scripts/capture_all_ui_windows.py --out screenshot-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayDock-native-UI-screenshot-gallery
          path: screenshot-gallery/
          if-no-files-found: error
