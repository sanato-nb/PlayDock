name: PlayDock 공통 기능 통합 검증
on:
  # Historical focused benchmark: manual only. Full suite is in source-final-feature-review.yml.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/src/playdock;${{ github.workspace }};${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt 및 빌드 의존성
        run: python -m pip install -r requirements.txt pytest "pyinstaller>=6.11,<7"
      - name: 공통 기능 및 4-B 재검증
        run: python -m pytest -q -s tests/audit/test_common_helper_optimization.py tests/audit/test_title_read_optimization.py
      - name: 전체 Windows 회귀 테스트
        shell: pwsh
        run: |
          python -m compileall -q app.py title_editor.py src/playdock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          exit $LASTEXITCODE
      - name: Windows EXE 빌드 검증
        shell: pwsh
        run: |
          ./scripts/Build-Windows-Release.ps1 -NoLaunch -SkipTests -NoWinget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/PlayDock.exe")) { throw "PlayDock.exe missing" }
          Get-FileHash "dist/PlayDock.exe" -Algorithm SHA256
